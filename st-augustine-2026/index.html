argin-top:8px;font-size:12px}.sectiontitle{font-weight:800;margin-top:14px}.legend{position:absolute;z-index:500;left:10px;top:10px;background:#fffffff2;padding:8px 10px;border-radius:12px;font-size:11px;box-shadow:0 2px 10px #0002}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.bottom{position:fixed;z-index:700;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #ddd;padding:10px 12px;display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:10px;padding:11px;background:#172033;color:#fff}.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #172033;font-weight:800;font-size:12px}.pin.done{background:var(--pink);color:#fff}.pin.tom{background:var(--purple);color:#fff}.pin.must{background:var(--gold)}.pin.trolley{background:var(--orange);border-color:#fff;color:#fff;box-shadow:0 0 0 2px var(--orange)}.leaflet-popup-content{min-width:225px}.foodbox{background:#fff7fb;border:1px solid #ffd2e4;border-radius:12px;padding:10px;margin-top:8px}.notice{background:#fff8e6;border:1px solid #f4d38c;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}.good{background:#ecfdf3;border:1px solid #a7f3d0;border-radius:12px;padding:10px;margin:8px 0;font-size:13px}@media(max-width:520px){.forks{grid-template-columns:1fr}#map{min-height:380px}}</style></head><body><div class="head"><div class="title">GPT · St. Augustine live map</div><div class="sub">Plan · Actual · Trolley · Combined</div><div id="wx" class="wx">Loading weather…</div></div><div class="tabs"><button class="on" data-view="actual">📍 Actual</button><button data-view="plan">🗓 Plan</button><button data-view="trolley">🚋 Trolley</button><button data-view="combined">🗺 Combined</button></div><div class="daytabs"><button class="on" data-day="fri">Fri · Day 1</button><button data-day="sat">Sat · Day 2</button><button data-day="sun">Sun · Day 3</button></div><div class="filters"><button class="on" data-f="al let map=L.map('map').setView([29.897,-81.315],14),markers=[],lines=[],here=null,filter='all',view='actual',day='fri';L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function mi(a,b,c,d){const R=3958.8,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),q=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function nav(s){return'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=walking'}function reviews(s){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' St Augustine FL')}function visible(s){if(filter==='all')return true;if(filter==='must')return !!s.must;return s.tags&&s.tags.includes(filter)}function clear(){markers.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));markers=[];lines=[]}function addLine(a,b,color,dashed,weight=5){let l=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color,weight,opacity:.82,dashArray:dashed?'9 9':null}).addTo(map);lines.push(l)}function addTripMarker(s,label){let cls='pin '+(s.done?'done':day!=='fri'?'tom':s.must?'must':'');let m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="'+cls+'">'+label+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);let t=s.trolley?'<div class="meta">🚋 Trolley Stop '+s.trolley+(day==='fri'?' · context only today':' · trolley usable today')+'</div>':'';let d=here?'<div class="meta">From you: '+mi(here.lat,here.lng,s.lat,s.lng).toFixed(1)+' mi</div>':'';m.bindPopup('<b>'+s.name+'</b><div>'+s.what+'</div>'+t+d+'<a class="btn" target="_blank" href="'+nav(s)+'">Walk there</a> <a class="btn" target="_blank" href="'+reviews(s)+'">Maps & reviews</a>');markers.push(m)}function addTrolleyMarker(t){let m=L.marker([t.lat,t.lng],{icon:L.divIcon({className:'',html:'<div class="pin trolley">'+t.n+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);m.bindPopup('<b>🚋 Stop '+t.n+' · '+t.name+'</b><div>'+t.places+'</div><div class="note">'+t.tip+'</div>');markers.push(m)}function daySeq(){if(day==='fri')return[stops.hotel,stops.pirate,stops.coffee,stops.play,stops.school,stops.dinner,stops.kilwins];if(day==='sat')return[stops.castillo,stops.colonial,stops.plaza,stops.lightner,stops.flagler,stops.fountain];return[stops.mose,stops.matanzas]}function rankFrom(origin,cands){return cands.map(s=>{let dist=mi(origin.lat,origin.lng,s.lat,s.lng),score=(s.must?5:0)+(s.tags.includes('kids')?2:0)+(s.tags.includes('history')?2:0)-dist*2;return{s,dist,score}}).sort((a,b)=>b.score-a.score)}function draw(){clear();let bounds=[];if(view==='trolley'||view==='combined'){trolley.forEach(t=>{addTrolleyMarker(t);bounds.push([t.lat,t.lng])});for(let i=0;i<trolley.length-1;i++)addLine(trolley[i],trolley[i+1],ORANGE,false,4);addLine(trolley[trolley.length-1],trolley[0],ORANGE,false,4)}if(view==='actual'){addTripMarker(stops.blue,'✓');addTripMarker(stops.hotel,'N');bounds.push([stops.blue.lat,stops.blue.lng],[stops.hotel.lat,stops.hotel.lng]);addLine(stops.blue,stops.hotel,PINK,false);let forks=day==='fri'?[stops.castillo,stops.pirate]:day==='sat'?[stops.lightner,stops.fountain]:[stops.mose,stops.matanzas];forks.forEach((s,i)=>{addTripMarker(s,i?'B':'A');bounds.push([s.lat,s.lng]);addLine(stops.hotel,s,day==='fri'?PINK:PURPLE,true)})}if(view==='plan'||view==='combined'){let seq=daySeq().filter(visible);seq.forEach((s,i)=>{addTripMarker(s,i+1);bounds.push([s.lat,s.lng])});for(let i=0;i<seq.length-1;i++)addLine(seq[i],seq[i+1],day==='fri'?PINK:PURPLE,true)}if(here){let c=L.circleMarker([here.lat,here.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map).bindPopup('You are here');markers.push(c);bounds.push([here.lat,here.lng])}if(bounds.length)map.fitBounds(bounds,{padding:[28,28],maxZoom:15});renderLegend();render()}function renderLegend(){let l=document.getElementById('legend');if(view==='trolley')l.innerHTML='<div><span class="dot" style="background:'+ORANGE+'"></span>Trolley route + stops</div><div>Stop cards include family-use tips</div>';else if(view==='combined')l.innerHTML='<div><span class="dot" style="background:'+ORANGE+'"></span>Trolley</div><div><span class="dot" style="background:'+(day==='fri'?PINK:PURPLE)+'"></span>'+ (day==='fri'?'Day 1 plan':'Day 2/3 plan')+'</div><div>dashed = planned route</div>';else l.innerHTML='<div><span class="dot" style="background:'+PINK+'"></span>Actual / confirmed</div><div><span class="dot" style="background:'+PURPLE+'"></span>Future day</div><div>solid = did it · dashed = suggestion</div>'}function trolleyStatus(){return day==='fri'?'<div class="notice"><b>Day 1 trolley OFF.</b> You do not have the trolley today. Stop numbers are shown only as orientation context; routing recommendations stay walking/car-based.</div>':'<div class="good"><b>Trolley enabled for this day.</b> Use trolley stops as an active transport option. For short downtown hops, compare walking first because waiting can erase the time savings.</div>'}function render(){let c=document.getElementById('content');if(view==='actual'){let o=here||stops.hotel;let cand=day==='fri'?[stops.castillo,stops.pirate,stops.colonial]:day==='sat'?[stops.castillo,stops.lightner,stops.fountain,stops.colonial]:[stops.mose,stops.matanzas];let forks=rankFrom(o,cand).slice(0,2);c.innerHTML=trolleyStatus()+'<div class="card done"><div class="name">✓ Blue Hen Café · actually went</div><div class="meta">4★ from you</div><div class="foodbox">Chicken biscuits were good, but needed jam/marmalade on the side. You wanted more pancake flavor choices.</div></div><div class="card next"><div class="name">NEXT · Renaissance hotel</div><div class="note">Drop off the bags, settle parking, then continue downtown. Trolley is not treated as available on Day 1.</div><a class="btn" target="_blank" href="'+nav(stops.hotel)+'">Navigate to hotel</a></div><div class="sectiontitle">Two next-route forks</div><div class="forks">'+forks.map((x,i)=>'<div class="fork"><b>'+(i?'B · ':'A · ')+x.s.name+'</b><div class="meta">'+x.dist.toFixed(1)+' mi from current reference'+(x.s.trolley?' · 🚋 Stop '+x.s.trolley:'')+'</div><div class="note">'+x.s.what+'</div><a class="btn" target="_blank" href="'+nav(x.s)+'">Route</a></div>').join('')+'</div><div class="card"><div class="note"><b>Actual view rule:</b> solid pink = confirmed places you really did; dashed = suggestions. Tell me each place you actually go and this path can be updated without overwriting the original plan.</div></div>'}else if(view==='plan'){let seq=daySeq().filter(visible);c.innerHTML=trolleyStatus()+seq.map((s,i)=>'<div class="card '+(day==='fri'?'plan':'tom')+'"><div class="name">'+(i+1)+' · '+s.name+'</div><div class="meta">'+(s.trolley?'🚋 Stop '+s.trolley+(day==='fri'?' · context only':' · available as transport'):'')+'</div><div class="note">'+s.what+'</div>'+(s.food?'<div class="foodbox">'+s.food+'</div>':'')+'<a class="btn" target="_blank" href="'+reviews(s)+'">Reviews / hours</a></div>').join('')}else if(view==='trolley'){c.innerHTML='<div class="card trolley"><div class="name">🚋 Trolley-only view</div><div class="note">All 22 brochure stops are mapped with family-oriented advice. This route is a visual guide through the stop sequence; use the official trolley tracker/signage for the exact vehicle path and live arrivals.</div></div>'+trolleyStatus()+trolley.map(t=>'<div class="card trolley"><div class="name">Stop '+t.n+' · '+t.name+'</div><div class="meta">'+t.places+'</div><div class="note">'+t.tip+'</div></div>').join('')}else{let relevant=Object.values(stops).filter(s=>s.trolley&&daySeq().includes(s));c.innerHTML=trolleyStatus()+'<div class="card"><div class="name">🗺 Combined intelligence</div><div class="note">Trip plan + trolley route on one map. Only use trolley operationally on Day 2/3; on Day 1 the orange route is reference only.</div></div>'+relevant.map(s=>'<div class="card"><div class="name">'+s.name+' · 🚋 Stop '+s.trolley+'</div><div class="note">'+s.what+'</div><div class="meta">'+(day==='fri'?'Today: walk/car; trolley is context only.':'Today: compare walk vs trolley before moving.')+'</div></div>').join('')}}document.querySelector('.tabs').onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.view;draw()};document.querySelector('.daytabs').onclick=e=>{if(!e.target.dataset.day)return;document.querySelectorAll('.daytabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');day=e.target.dataset.day;draw()};document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.f)return;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');filter=e.target.dataset.f;draw()};document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};draw()},()=>alert('Location blocked. Allow location in Safari settings.'));document.getElementById('near').onclick=()=>{view='actual';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='actual'));draw()};fetch('https://api.open-meteo.com/v1/forecast?latitude=29.895&longitude=-81.314&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=3').then(r=>r.json()).then(w=>{document.getElementById('wx').textContent='Now '+Math.round(w.current.temperature_2m)+'° · feels '+Math.round(w.current.apparent_temperature)+'° · today high '+Math.round(w.daily.temperature_2m_max[0])+'° · rain '+w.daily.precipitation_probability_max[0]+'%'}).catch(()=>document.getElementById('wx').textContent='Weather unavailable');draw();</script></body></html>
