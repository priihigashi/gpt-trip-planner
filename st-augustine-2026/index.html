<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>GPT St. Augustine Trip</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--pink:#ff5fa2;--purple:#8b5cf6;--blue:#46a8d8;--ink:#172033;--muted:#667085;--bg:#f7f4f8;--green:#0d9488;--gold:#f2b84b;--line:#e5e7eb}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.head{padding:14px 16px;background:#fff;border-bottom:1px solid #eee}.title{font-size:23px;font-weight:850}.sub{font-size:13px;color:var(--muted)}.wx{margin-top:8px;font-size:13px;background:#f6f8fb;border:1px solid #e8ebf0;border-radius:12px;padding:9px 10px}.tabs,.filters{display:flex;gap:7px;overflow:auto;padding:9px 12px;background:#fff}.tabs button,.filters button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:650}.tabs button.on{background:#172033;color:#fff}.filters button.on{background:#fff0f6;border-color:#ff9ec5}#map{height:48vh;min-height:360px}.mapwrap{position:relative}.legend{position:absolute;z-index:500;left:10px;top:10px;background:#fffffff2;padding:8px 10px;border-radius:12px;font-size:11px;box-shadow:0 2px 10px #0002}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.panel{padding:12px 14px 105px;max-width:760px;margin:auto}.section{font-size:16px;font-weight:850;margin:15px 0 6px}.card{background:#fff;border:1px solid #f0f0f2;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 3px 14px #0000000b}.plan1{border-left:5px dashed var(--pink)}.plan2{border-left:5px dashed var(--purple)}.actual{border-left:5px solid var(--pink)}.next{border-left:5px solid var(--green)}.name{font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:4px}.note{font-size:13px;line-height:1.45;margin-top:7px}.food{background:#fff7fb;border:1px solid #ffd2e4;border-radius:12px;padding:10px;margin-top:8px}.info{background:#f7fbff;border:1px solid #d8eaf7;border-radius:12px;padding:10px;margin-top:8px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;border:1px solid #ddd;border-radius:99px;padding:4px 7px}.forks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fork{border:2px dashed #b9b0c6;background:#fff;border-radius:14px;padding:11px}.btn{display:inline-block;background:#172033;color:#fff;text-decoration:none;border-radius:9px;padding:8px 10px;margin:8px 6px 0 0;font-size:12px}.bottom{position:fixed;z-index:700;bottom:0;left:0;right:0;background:#fffffff8;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:10px;padding:11px;background:#172033;color:#fff;font-weight:750}.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #172033;font-weight:850;font-size:12px}.pin.actual{background:var(--pink);color:#fff}.pin.tom{background:var(--purple);color:#fff}.pin.must{background:var(--gold)}@media(max-width:520px){.forks{grid-template-columns:1fr}#map{min-height:350px}}</style></head><body><div class="head"><div class="title">GPT · St. Augustine</div><div class="sub">Recommended plan first · Actual trip log at the end</div><div id="wx" class="wx">Loading weather…</div></div><div class="tabs"><button class="on" data-view="day1">Day 1 plan</button><button data-view="day2">Day 2 plan</button><button data-view="actual">What we actually did</button></div><div class="filters"><button class="on" data-f="all">Everything</button><button data-f="must">Must see</button><button data-f="kids">Kids</button><button data-f="food">Food</button><button data-f="history">History</button><button data-f="rest">Rest / AC</button></div><div class="mapwrap"><div id="map"></div><div class="legend"><div><span class="dot" style="background:#ff5fa2"></span>Today</div><div><span class="dot" style="background:#8b5cf6"></span>Tomorrow</div><div>solid = confirmed · dashed = suggestion</div></div></div><div class="panel"><div id="content"></div></div><div class="bottom"><button id="loc">Use my location</button><button id="near">Two best next</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const C={pink:'#ff5fa2',purple:'#8b5cf6'};const S={blue:{name:'Blue Hen Café',lat:29.8900,lng:-81.3267,tags:['food'],actual:1,what:'Breakfast actually visited.',detail:'Your rating: 4★. Chicken biscuits were good, but you wanted jam or marmalade on the side. You also wished there were more pancake flavor choices.'},hotel:{name:'Renaissance St. Augustine Historic Downtown Hotel',lat:29.8994,lng:-81.3156,tags:['rest'],actual:1,what:'Checked in early at about 1 PM.',detail:'Normal published check-in is 4 PM, but they let you into the room early. You parked across the street in the Historic Downtown Parking Facility because it was $20 per entry; hotel valet is $40/day.'},walk:{name:'Historic district wandering',lat:29.8982,lng:-81.3146,tags:['history','kids'],actual:1,what:'Walked around close to the hotel without going too far, then turned back toward the fort.'},castle:{name:'Castillo de San Marcos',lat:29.89786,lng:-81.31152,tags:['history','kids','must'],must:1,actual:1,what:'Arrived around 2:30 PM and stayed until closing.',detail:'$15 per adult, kids 15 and under free. Clean bathrooms and water fountains. Small room where kids can play. Beautiful outdoor area; the kids played with sand and sticks and climbed some of the rocks.'},pizz:{name:'Pizzalley’s / Chianti Room',lat:29.89421,lng:-81.31278,tags:['food','kids'],actual:1,what:'Dinner was great.',detail:'You shared the Sweet Datil’ roni — pepperoni, ricotta and hot datil honey — plus lasagna. Kids had cheese pizza and spaghetti, about $10 each in your visit.'},sweet:{name:'The Sweet Spot (likely)',lat:29.8963,lng:-81.3134,tags:['food','kids'],actual:1,what:'Kids got ice cream while you walked St. George Street.',detail:'You thought it was only okay. Your recommendation for next time: choose Kilwins or Ben & Jerry’s instead. The shop name is logged as likely The Sweet Spot because it matches your “Sweet something” memory.'},hotel8:{name:'Back at hotel · shower + rest',lat:29.8994,lng:-81.3156,tags:['rest'],actual:1,what:'Back around 8 PM. Great shower, then rest.'},pirate:{name:'Pirate & Treasure Museum',lat:29.89702,lng:-81.31297,tags:['history','kids','must','rest'],must:1,what:'Interactive, indoor, AC. Strong kid-first stop.'},colonial:{name:'Colonial Quarter',lat:29.8966,lng:-81.3133,tags:['history','kids','must'],must:1,what:'Living-history demonstrations and colonial spaces.'},trolley:{name:'Old Town Trolley',lat:29.8989,lng:-81.316,tags:['history','kids','rest'],what:'90-minute narrated loop; useful for orientation and heat.'},school:{name:'Oldest Wooden Schoolhouse',lat:29.89734,lng:-81.31355,tags:['history','kids'],what:'Quick historic stop on St. George.'},play:{name:'Project Swing',lat:29.8982,lng:-81.31688,tags:['kids','rest'],what:'Shaded playground.'},flagler:{name:'Flagler College',lat:29.8929,lng:-81.3146,tags:['history'],what:'Gilded Age architecture; exterior or short visit.'},plaza:{name:'Plaza de la Constitución',lat:29.8925,lng:-81.3128,tags:['history','rest'],what:'Historic central plaza and natural walking stop.'},blackraven:{name:'Black Raven pirate cruise',lat:29.8912,lng:-81.3100,tags:['kids','must'],must:1,what:'Major kid experience if you want a boat activity.'},mose:{name:'Fort Mose',lat:29.959,lng:-81.343,tags:['history','must'],must:1,what:'Important Black history site; outside compact downtown.'},light:{name:'St. Augustine Lighthouse',lat:29.885,-81.288,lng:-81.288,tags:['history','kids','must'],must:1,what:'Climb/activity/views; good Sunday option.'}};const plans={day1:[S.blue,S.hotel,S.trolley,S.pirate,S.colonial,S.school,S.play,S.pizz,S.sweet],day2:[S.castle,S.colonial,S.plaza,S.flagler,S.blackraven,S.pizz],actual:[S.blue,S.hotel,S.walk,S.castle,S.pizz,S.sweet,S.hotel8]};let view='day1',filter='all',here=null,map=L.map('map').setView([29.896,-81.315],14),marks=[],lines=[];L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function mi(a,b,c,d){const R=3958.8,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),q=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function nav(s){return 'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=walking'}function reviews(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' St Augustine FL')}function match(s){return filter==='all'||filter==='must'&&s.must||s.tags&&s.tags.includes(filter)}function clear(){marks.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));marks=[];lines=[]}function addLine(a,b,color,dashed){lines.push(L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color,weight:5,opacity:.8,dashArray:dashed?'9 9':null}).addTo(map))}function draw(){clear();let list=plans[view].filter(match),col=view==='day2'?C.purple:C.pink,dashed=view!=='actual';for(let i=0;i<plans[view].length-1;i++)addLine(plans[view][i],plans[view][i+1],col,dashed);list.forEach((s,i)=>{let cls='pin '+(view==='actual'?'actual':view==='day2'?'tom':s.must?'must':'');let m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="'+cls+'">'+(i+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);let d=here?'<div class="meta">From you: '+mi(here.lat,here.lng,s.lat,s.lng).toFixed(1)+' mi</div>':'';m.bindPopup('<b>'+s.name+'</b><div>'+s.what+'</div>'+d+'<a class="btn" target="_blank" href="'+nav(s)+'">Walk there</a>');marks.push(m)});if(here){marks.push(L.circleMarker([here.lat,here.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map).bindPopup('You are here'))}if(list.length)map.fitBounds(list.map(s=>[s.lat,s.lng]),{padding:[35,35],maxZoom:15});render()}function card(s,cls){return '<div class="card '+cls+'"><div class="name">'+s.name+'</div><div class="note">'+s.what+'</div>'+(s.detail?'<div class="'+(s.tags.includes('food')?'food':'info')+'">'+s.detail+'</div>':'')+'<div class="chips">'+(s.must?'<span class="chip">Must see</span>':'')+(s.tags.includes('kids')?'<span class="chip">Kids</span>':'')+(s.tags.includes('food')?'<span class="chip">Food</span>':'')+'</div><a class="btn" target="_blank" href="'+reviews(s)+'">Reviews / hours</a><a class="btn" target="_blank" href="'+nav(s)+'">Route</a></div>'}function render(){let c=document.getElementById('content');if(view==='day1'){c.innerHTML='<div class="section">Recommended Day 1</div>'+plans.day1.filter(match).map(s=>card(s,'plan1')).join('')+'<div class="section">Why this order</div><div class="card"><div class="note">Eat first, park once, keep high-value kid/history stops early, then use St. George Street for easy evening walking, dinner and dessert.</div></div>'}else if(view==='day2'){c.innerHTML='<div class="section">Recommended Day 2</div>'+plans.day2.filter(match).map(s=>card(s,'plan2')).join('')+'<div class="section">Priority logic</div><div class="card"><div class="note">Castillo first if you did not already spend enough time there; otherwise shift priority to Colonial Quarter, Flagler/Plaza, and a special kid experience such as the pirate cruise.</div></div>'}else{c.innerHTML='<div class="section">What we actually did · Friday</div>'+plans.actual.filter(match).map(s=>card(s,'actual')).join('')+'<div class="section">What this teaches the planner</div><div class="card"><div class="note">Your family is happy to stay much longer than planned when the kids can freely explore. Late afternoon/evening becomes mostly stores and food because many museums close. Future recommendations should therefore front-load museums and preserve flexible walking/shopping for after 5 PM.</div></div><div class="section">Two next-stop forks</div><div id="forks"></div>';setTimeout(showForks,0)}}function showForks(){let el=document.getElementById('forks');if(!el)return;let origin=here||S.hotel8,cands=[S.pirate,S.colonial,S.flagler,S.mose,S.light].map(s=>({s,d:mi(origin.lat,origin.lng,s.lat,s.lng),score:(s.must?5:0)+(s.tags.includes('kids')?2:0)+(s.tags.includes('history')?2:0)-mi(origin.lat,origin.lng,s.lat,s.lng)*2})).sort((a,b)=>b.score-a.score).slice(0,2);el.innerHTML='<div class="forks">'+cands.map((x,i)=>'<div class="fork"><b>'+(i?'B · ':'A · ')+x.s.name+'</b><div class="meta">'+x.d.toFixed(1)+' mi from reference</div><div class="note">'+x.s.what+'</div><a class="btn" target="_blank" href="'+nav(x.s)+'">Route</a></div>').join('')+'</div>'}document.querySelector('.tabs').onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.view;draw()};document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.f)return;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');filter=e.target.dataset.f;draw()};document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};draw()},()=>alert('Location blocked. Allow location in Safari settings.'));document.getElementById('near').onclick=()=>{view='actual';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='actual'));draw()};fetch('https://api.open-meteo.com/v1/forecast?latitude=29.897&longitude=-81.314&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=3').then(r=>r.json()).then(w=>document.getElementById('wx').innerHTML='<b>'+Math.round(w.current.temperature_2m)+'°</b> · feels '+Math.round(w.current.apparent_temperature)+'° · today rain '+w.daily.precipitation_probability_max[0]+'% · tomorrow '+Math.round(w.daily.temperature_2m_max[1])+'° / rain '+w.daily.precipitation_probability_max[1]+'%').catch(()=>document.getElementById('wx').textContent='Weather unavailable');draw();</script></body></html>
