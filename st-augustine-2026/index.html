<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPT St. Augustine Live Trip</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--pink:#ff5fa2;--purple:#8b5cf6;--ink:#172033;--bg:#f7f4f8;--green:#0d9488;--gold:#f2b84b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}#map{height:54vh;min-height:420px}.head{padding:14px 16px;background:#fff}.title{font-size:23px;font-weight:800}.sub{font-size:13px;color:#667085}.wx{margin-top:8px;font-size:13px}.tabs,.filters{display:flex;gap:7px;overflow:auto;padding:10px 12px;background:#fff}.tabs button,.filters button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap}.tabs .on{background:#172033;color:white}.panel{padding:12px 14px 100px}.card{background:#fff;border-radius:16px;padding:13px;margin:9px 0;box-shadow:0 3px 14px #0000000c}.card.done{border-left:5px solid var(--pink)}.card.next{border-left:5px solid var(--green)}.card.plan{border-left:5px dashed var(--pink)}.card.tom{border-left:5px dashed var(--purple)}.name{font-weight:800}.meta{color:#667085;font-size:12px;margin-top:4px}.note{font-size:13px;margin-top:7px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;border:1px solid #ddd;border-radius:99px;padding:4px 7px}.forks{display:grid;grid-template-columns:1fr 1fr;gap:8px}.fork{border:2px dashed #b9b0c6;background:#fff;border-radius:14px;padding:11px}.fork b{display:block}.btn{display:inline-block;background:#172033;color:white;text-decoration:none;border-radius:9px;padding:8px 10px;margin-top:8px;font-size:12px}.smallbtn{border:0;background:#eef2f6;border-radius:8px;padding:6px 8px;margin:4px 4px 0 0}.legend{position:absolute;z-index:500;left:10px;top:145px;background:#fffffff0;padding:8px 10px;border-radius:12px;font-size:11px;box-shadow:0 2px 10px #0002}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.bottom{position:fixed;z-index:700;bottom:0;left:0;right:0;background:#fffffff5;border-top:1px solid #ddd;padding:10px 12px;display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:10px;padding:11px;background:#172033;color:#fff}.pin{width:28px;height:28px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid #172033;font-weight:800}.pin.done{background:var(--pink);color:#fff}.pin.tom{background:var(--purple);color:#fff}.pin.must{background:var(--gold)}.leaflet-popup-content{min-width:220px}.foodbox{background:#fff7fb;border:1px solid #ffd2e4;border-radius:12px;padding:10px;margin-top:8px}.sectiontitle{font-weight:800;margin-top:14px}</style></head><body><div class="head"><div class="title">GPT · St. Augustine live map</div><div class="sub">Plan vs what we actually did · Fri–Sun · family route</div><div id="wx" class="wx">Loading weather…</div></div><div class="tabs"><button class="on" data-view="live">Live / actual</button><button data-view="fri">Friday plan</button><button data-view="sat">Saturday</button><button data-view="sun">Sunday</button></div><div class="filters"><button data-f="all">Everything</button><button data-f="must">Must see</button><button data-f="kids">Kids</button><button data-f="food">Food</button><button data-f="coffee">Coffee</button><button data-f="history">History</button><button data-f="rest">Rest / AC</button></div><div style="position:relative"><div id="map"></div><div class="legend"><div><span class="dot" style="background:#ff5fa2"></span>Today / confirmed</div><div><span class="dot" style="background:#8b5cf6"></span>Tomorrow</div><div>solid = did it · dashed = suggestion</div></div></div><div class="panel"><div id="content"></div></div><div class="bottom"><button id="loc">Use my location</button><button id="near">Nearby now</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const PINK='#ff5fa2',PURPLE='#8b5cf6';const stops={blue:{name:'Blue Hen Café',lat:29.8900,lng:-81.3267,time:'Done',tags:['food'],done:1,what:'Breakfast actually visited',food:'Your rating: 4★. Chicken biscuits were good, but you wanted jam or marmalade on the side. You also wished there were more pancake flavor choices. Mike can choose seafood; your recommendations should default to non-seafood.',hours:'Breakfast/lunch café — check live listing for current hours',price:'$$'},hotel:{name:'Renaissance St. Augustine Historic Downtown Hotel',lat:29.8994,lng:-81.3156,time:'NEXT',tags:['rest'],next:1,must:1,what:'Drop off bags, then park and continue on foot',food:'Parking: Marriott currently lists valet only at $40/day. The Historic Downtown Parking Facility is nearby if you prefer public parking; compare convenience before leaving the car.',hours:'Check-in 4:00 PM',price:'Valet $40/day'},castillo:{name:'Castillo de San Marcos',lat:29.89786,lng:-81.31152,time:'Fork A',tags:['history','kids'],must:1,what:'Highest-value nearby history. Great views, cannons, fort rooms.'},pirate:{name:'Pirate & Treasure Museum',lat:29.89702,lng:-81.31297,time:'Fork B',tags:['history','kids'],must:1,what:'Best nearby kid-first indoor stop, AC + interactive exhibits.'},trolley:{name:'Old Town Trolley',lat:29.8989,lng:-81.316,time:'Plan',tags:['history','kids'],what:'90-minute narrated loop; useful for orientation and heat break.'},colonial:{name:'Colonial Quarter',lat:29.8966,lng:-81.3133,time:'Plan',tags:['history','kids'],must:1,what:'Living history, demonstrations, reconstructed colonial spaces.'},coffee:{name:'Crucial Coffee',lat:29.89588,lng:-81.31198,time:'Optional',tags:['coffee','rest'],what:'Coffee / cold drink / ice cream stop near fort.'},school:{name:'Oldest Wooden Schoolhouse',lat:29.89734,lng:-81.31355,time:'Optional',tags:['history','kids'],what:'Quick historic stop on St. George.'},play:{name:'Project Swing',lat:29.8982,lng:-81.31688,time:'Optional',tags:['kids','rest'],what:'Shaded playground.'},flagler:{name:'Flagler College',lat:29.8929,lng:-81.3146,time:'Optional',tags:['history'],what:'Gilded Age Hotel Ponce de León architecture.'},plaza:{name:'Plaza de la Constitución',lat:29.8925,lng:-81.3128,time:'Optional',tags:['history','rest'],what:'Historic central plaza; natural walking stop.'},dinner:{name:'Pizzalley’s / dinner area',lat:29.89421,lng:-81.31278,time:'Later',tags:['food'],what:'Easy family dinner; show backups if wait is long.'},kilwins:{name:'Kilwins',lat:29.89752,lng:-81.31366,time:'Later',tags:['food','kids'],what:'Ice cream on the walk back.'},mose:{name:'Fort Mose',lat:29.959,lng:-81.343,time:'Tomorrow / Sun',tags:['history'],must:1,tom:1,what:'Major Black history site.'},matanzas:{name:'Fort Matanzas / coast option',lat:29.7149,lng:-81.2398,time:'Sunday',tags:['history','kids'],tom:1,what:'Ferry/fort option for half day.'}};let map=L.map('map').setView([29.895,-81.316],14),markers=[],lines=[],here=null,filter='all',view='live';L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function mi(a,b,c,d){const R=3958.8,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),q=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function nav(s){return 'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=walking'}function reviews(s){return 'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' St Augustine FL')}function visible(s){if(filter==='all')return true;return s.tags&&s.tags.includes(filter)||filter==='must'&&s.must}function clear(){markers.forEach(x=>map.removeLayer(x));lines.forEach(x=>map.removeLayer(x));markers=[];lines=[]}function addLine(a,b,color,dashed){let l=L.polyline([[a.lat,a.lng],[b.lat,b.lng]],{color,weight:5,opacity:.8,dashArray:dashed?'9 9':null}).addTo(map);lines.push(l)}function draw(){clear();let list=Object.values(stops).filter(visible);list.forEach((s,i)=>{let cls='pin '+(s.done?'done':s.tom?'tom':s.must?'must':'');let m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="'+cls+'">'+(i+1)+'</div>',iconSize:[28,28],iconAnchor:[14,14]})}).addTo(map);let d=here?'<div>From you: '+mi(here.lat,here.lng,s.lat,s.lng).toFixed(1)+' mi</div>':'';m.bindPopup('<b>'+s.name+'</b><div>'+s.what+'</div>'+d+'<a class="btn" target="_blank" href="'+nav(s)+'">Walk there</a> <a class="btn" target="_blank" href="'+reviews(s)+'">Maps & reviews</a>');markers.push(m)});if(view==='live'){addLine(stops.blue,stops.hotel,PINK,false);addLine(stops.hotel,stops.castillo,PINK,true);addLine(stops.hotel,stops.pirate,PINK,true)}else if(view==='fri'){let seq=[stops.hotel,stops.trolley,stops.pirate,stops.coffee,stops.play,stops.school,stops.dinner,stops.kilwins];for(let i=0;i<seq.length-1;i++)addLine(seq[i],seq[i+1],PINK,true)}else if(view==='sat'){let seq=[stops.castillo,stops.colonial,stops.plaza,stops.flagler];for(let i=0;i<seq.length-1;i++)addLine(seq[i],seq[i+1],PURPLE,true)}else addLine(stops.mose,stops.matanzas,PURPLE,true);if(here){let c=L.circleMarker([here.lat,here.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map).bindPopup('You are here');markers.push(c)}if(list.length)map.fitBounds(list.map(s=>[s.lat,s.lng]),{padding:[35,35],maxZoom:15});render()}function rankFrom(origin,cands){return cands.map(s=>{let dist=mi(origin.lat,origin.lng,s.lat,s.lng),score=(s.must?5:0)+(s.tags.includes('kids')?2:0)+(s.tags.includes('history')?2:0)-dist*2;return {s,dist,score}}).sort((a,b)=>b.score-a.score)}function render(){let c=document.getElementById('content');if(view==='live'){let o=here||stops.hotel;let forks=rankFrom(o,[stops.castillo,stops.pirate,stops.colonial,stops.trolley]).slice(0,2);c.innerHTML='<div class="card done"><div class="name">✓ Blue Hen Café · actually went</div><div class="meta">4★ from you</div><div class="foodbox">Chicken biscuits: good, but needed jam/marmalade on the side. You wanted more pancake flavor choices. Future food cards should recommend dishes from reviews for you, Mike and the kids.</div></div><div class="card next"><div class="name">NEXT · Renaissance hotel</div><div class="note">Drop off the bags. Marriott lists valet parking at <b>$40/day</b>. The city Historic Downtown Parking Facility is nearby as an alternative. Once the car is settled, stay on foot for downtown.</div><a class="btn" target="_blank" href="'+nav(stops.hotel)+'">Navigate to hotel</a></div><div class="sectiontitle">Two next-route forks</div><div class="forks">'+forks.map((x,i)=>'<div class="fork"><b>'+(i===0?'A · ':'B · ')+x.s.name+'</b><div class="meta">'+x.dist.toFixed(1)+' mi from current reference</div><div class="note">'+x.s.what+'</div><a class="btn" target="_blank" href="'+nav(x.s)+'">Route</a></div>').join('')+'</div><div class="sectiontitle">How the live map works</div><div class="card"><div class="note"><b>Solid pink:</b> confirmed/actually did. <b>Dashed pink:</b> today suggestion not confirmed. <b>Purple:</b> tomorrow. Tell me where you actually go and I can update the confirmed path and recalculate the next two options.</div></div>'}else{let list=Object.values(stops).filter(visible).filter(s=>view==='sun'?s.tom:view==='sat'?(s===stops.castillo||s===stops.colonial||s===stops.flagler||s===stops.plaza):!s.tom);c.innerHTML=list.map(s=>'<div class="card '+(view==='sat'?'tom':'plan')+'"><div class="name">'+s.time+' · '+s.name+'</div><div class="note">'+s.what+'</div>'+(s.food?'<div class="foodbox">'+s.food+'</div>':'')+'<a class="btn" target="_blank" href="'+reviews(s)+'">Reviews / hours</a></div>').join('')}}document.querySelector('.tabs').onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.view;draw()};document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.f)return;filter=e.target.dataset.f;draw()};document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};draw()},()=>alert('Location blocked. Allow location in Safari settings.'));document.getElementById('near').onclick=()=>{view='live';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='live'));draw()};fetch('https://api.open-meteo.com/v1/forecast?latitude=29.895&longitude=-81.314&current=temperature_2m,apparent_temperature,weather_code&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=3').then(r=>r.json()).then(w=>{document.getElementById('wx').textContent='Now '+Math.round(w.current.temperature_2m)+'° · feels '+Math.round(w.current.apparent_temperature)+'° · today high '+Math.round(w.daily.temperature_2m_max[0])+'° · rain '+w.daily.precipitation_probability_max[0]+'%'}).catch(()=>document.getElementById('wx').textContent='Weather unavailable');draw();</script></body></html>
