function renderSmart(mode){smartMode=mode;const box=document.getElementById('smartbox'),o=here?'your live location':'Castillo area reference';const list=rank(mode,4);let title=mode==='rain'?'☔ Rain smart':mode==='kids'?'😵 Kids bored — quickest wins':'🌦 Weather-fit now';let intro=mode==='rain'?'Prioritizing indoor cover and minimizing wet walking.':mode==='kids'?'Prioritizing novelty, kid fit and short distance.':'Using the current rain outlook to prefer indoor or outdoor stops.';box.innerHTML='<div class="rainbox"><h3>'+title+'</h3><div class="note">From '+o+'. '+intro+'</div>'+list.map((x,i)=>'<div class="card rainpick"><div class="name">'+(i+1)+'. '+x.s.name+'</div><div class="meta">'+(x.s.indoor?'Indoor':'Weather-sensitive')+' · '+x.d.toFixed(1)+' mi · ~'+walkMin(x.d)+' min walk</div><div class="note">'+x.s.what+'</div><a class="btn" target="_blank" href="'+nav(x.s)+'">Go now</a></div>').join('')+'</div>';draw()}
function draw(){clear();let pts=[];if(view==='trolley'){trolley.forEach(t=>{addMarker({...t,id:'t'+t.n,what:t.places},t.n,'trolley');pts.push([t.lat,t.lng])});for(let i=0;i<trolley.length;i++)addLine(trolley[i],trolley[(i+1)%trolley.length],C.trolley,false,3)}else{let ids=view==='actual'?state.visited.filter(v=>v.day===day||!v.day).map(v=>v.id):daySeq[day];let arr=ids.map(id=>stops[id]).filter(Boolean).filter(visible);arr.forEach((s,i)=>{addMarker(s,i+1);pts.push([s.lat,s.lng])});if(view==='actual'){let v=state.visited.filter(x=>stops[x.id]&&((x.day||stops[x.id].day)===day));for(let i=0;i<v.length-1;i++)addLine(stops[v[i].id],stops[v[i+1].id],C[day],false,5)}else{for(let i=0;i<arr.length-1;i++)addLine(arr[i],arr[i+1],C[day],true,4)}if(view==='combined'){let rel=trolley.filter(t=>arr.some(s=>s.trolley===t.n));rel.forEach(t=>addMarker({...t,id:'t'+t.n,what:t.places},t.n,'trolley'))}}
if(smartMode){rank(smartMode,3).forEach((x,i)=>addMarker(x.s,'☔','rain'))}if(here){let h=L.circleMarker([here.lat,here.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map).bindPopup('You are here');markers.push(h);pts.push([here.lat,here.lng])}if(pts.length&&view!=='trolley')map.fitBounds(pts,{padding:[35,35],maxZoom:16});else if(view==='trolley')map.fitBounds(trolley.map(t=>[t.lat,t.lng]),{padding:[35,35]});legend();render()}
function legend(){document.getElementById('legend').innerHTML=view==='trolley'?'<div><span class="dot" style="background:'+C.trolley+'"></span>Trolley route / stops</div><div class="tiny">Day 1: reference only · Day 2: usable</div>':'<div><span class="dot" style="background:'+C[day]+'"></span>'+day.toUpperCase()+'</div><div>solid = went · dashed = planned</div>'+(smartMode?'<div><span class="dot" style="background:'+C.rain+'"></span>smart suggestion</div>':'')}
function stopCard(s,cls){const d=here?mi(here.lat,here.lng,s.lat,s.lng):null;return '<div class="card '+cls+'"><div class="name">'+s.name+'</div><div class="meta">'+(s.time||'')+(d!=null?' · '+d.toFixed(1)+' mi · ~'+walkMin(d)+' min walk':'')+(s.trolley?' · 🚋 '+s.trolley:'')+'</div><div class="note">'+s.what+'</div><div class="chips">'+(s.indoor?'<span class="chip indoor">Indoor</span>':'')+(s.kids?'<span class="chip kid">Kids</span>':'')+(s.free?'<span class="chip free">Free</span>':'')+(s.outdoor?'<span class="chip">Outdoor</span>':'')+'</div>'+(s.food?'<div class="foodbox">'+s.food+'</div>':'')+'<a class="btn" target="_blank" href="'+nav(s)+'">Navigate</a><a class="btn alt" target="_blank" href="'+reviews(s)+'">Hours / reviews</a><div class="logrow"><button data-act="went" data-id="'+s.id+'" class="'+(visited(s.id)?'on':'')+'">✓ Went</button><button data-act="skip" data-id="'+s.id+'" class="'+(skipped(s.id)?'on':'')+'">Skipped</button></div></div>'}
function render(){const c=document.getElementById('content');if(view==='trolley'){c.innerHTML='<div class="notice"><b>Trolley-only view.</b> All 22 stops stay visible for reference. <b>Day 1:</b> do not route with trolley. <b>Day 2:</b> trolley can be used as transportation.</div>'+trolley.map(t=>'<div class="card trolley"><div class="name">Stop '+t.n+' · '+t.name+'</div><div class="meta">'+t.places+'</div><div class="note">'+t.tip+'</div></div>').join('');return}
if(view==='actual'){let vs=state.visited.filter(v=>stops[v.id]&&((v.day||stops[v.id].day)===day));let html='<div class="good"><b>Actual trip</b> — only places you mark “Went” belong to the solid route. Suggestions stay suggestions.</div>';if(!vs.length)html+='<div class="notice">Nothing logged for this day yet. Use Plan or Combined and tap <b>✓ Went</b> after you actually do something.</div>';else html+=vs.sort((a,b)=>a.t-b.t).map(v=>stopCard(stops[v.id],'done')).join('');let forks=rank(wxData&&wxData.nextRain>=45?'weather':'kids',2);html+='<div class="sectiontitle">Where next — two branches</div><div class="forks">'+forks.map((x,i)=>'<div class="fork"><b>'+(i?'B · ':'A · ')+x.s.name+'</b><div class="meta">'+x.d.toFixed(1)+' mi · ~'+walkMin(x.d)+' min walk</div><div class="note">'+x.s.what+'</div><a class="btn" target="_blank" href="'+nav(x.s)+'">Go</a></div>').join('')+'</div>';c.innerHTML=html;return}
let arr=daySeq[day].map(id=>stops[id]).filter(Boolean).filter(visible);let banner=day==='fri'?'<div class="notice"><b>Day 1 trolley OFF.</b> Trolley stop numbers may appear as context, but do not use trolley routing today.</div>':day==='sat'?'<div class="good"><b>Day 2 trolley ON.</b> Use Trolley view to decide when riding beats walking.</div>':'';c.innerHTML=banner+arr.map(s=>stopCard(s,day==='fri'?'plan':'tom')).join('')}
document.body.addEventListener('click',e=>{const a=e.target.dataset.act,id=e.target.dataset.id;if(!a||!id)return;e.preventDefault();if(a==='went'){if(visited(id))state.visited=state.visited.filter(v=>v.id!==id);else{state.visited.push({id,t:Date.now(),day:stops[id].day});state.skipped=state.skipped.filter(x=>x!==id)}}else{if(skipped(id))state.skipped=state.skipped.filter(x=>x!==id);else{state.skipped.push(id);state.visited=state.visited.filter(v=>v.id!==id)}}save();draw()});
document.querySelector('.tabs').onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.view;smartMode=null;document.getElementById('smartbox').innerHTML='';draw()};
document.querySelector('.daytabs').onclick=e=>{if(!e.target.dataset.day)return;document.querySelectorAll('.daytabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');day=e.target.dataset.day;draw()};
document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.f)return;if(e.target.dataset.f==='nearby'&&!here){getLocation(()=>{filter='nearby';document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b.dataset.f==='nearby'));draw()});return}filter=e.target.dataset.f;document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b===e.target));draw()};
function getLocation(cb){if(!navigator.geolocation){alert('Location is unavailable on this browser.');return}navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};if(cb)cb();else draw()},()=>alert('Location blocked. Allow location for this site in Safari settings.'),{enableHighAccuracy:true,timeout:9000,maximumAge:60000})}
document.getElementById('loc').onclick=()=>getLocation();document.getElementById('near').onclick=()=>getLocation(()=>{view='actual';filter='nearby';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='actual'));document.querySelectorAll('.filters button').forEach(b=>b.classList.toggle('on',b.dataset.f==='nearby'));draw()});
document.getElementById('rainSmart').onclick=()=>getLocation(()=>renderSmart('rain'));document.getElementById('kidsBored').onclick=()=>getLocation(()=>renderSmart('kids'));document.getElementById('weatherSafe').onclick=()=>getLocation(()=>renderSmart('weather'));
const WMO={0:'Clear',1:'Mostly clear',2:'Partly cloudy',3:'Overcast',45:'Fog',48:'Fog',51:'Drizzle',53:'Drizzle',55:'Heavy drizzle',61:'Light rain',63:'Rain',65:'Heavy rain',80:'Showers',81:'Showers',82:'Heavy showers',95:'Thunderstorms',96:'Thunderstorms',99:'Thunderstorms'};
function weather(){const u='https://api.open-meteo.com/v1/forecast?latitude=29.897&longitude=-81.314&current=temperature_2m,apparent_temperature,weather_code,precipitation&hourly=temperature_2m,precipitation_probability&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=3';fetch(u).then(r=>r.json()).then(w=>{let idx=w.hourly.time.findIndex(t=>new Date(t)>=new Date(w.current.time));if(idx<0)idx=0;let hrs=[],nextRain=0,nextRainTime='';for(let i=idx;i<Math.min(idx+6,w.hourly.time.length);i++){let d=new Date(w.hourly.time[i]),h=d.getHours(),p=w.hourly.precipitation_probability[i]||0;if(p>nextRain){nextRain=p;nextRainTime=(h%12||12)+(h>=12?' PM':' AM')}hrs.push('<div class="hr '+(p>=45?'risky':'')+'">'+(h%12||12)+(h>=12?'p':'a')+'<b>'+Math.round(w.hourly.temperature_2m[i])+'°</b><span>'+p+'% rain</span></div>')}wxData={currentPrecip:w.current.precipitation||0,nextRain,nextRainTime};let wet=wxData.currentPrecip>0||nextRain>=55;document.getElementById('wx').innerHTML='<div class="wxmain"><div><div class="wxnow">'+Math.round(w.current.temperature_2m)+'° · '+(WMO[w.current.weather_code]||'Weather')+'</div><div class="wxmeta">Feels '+Math.round(w.current.apparent_temperature)+'° · today rain max '+w.daily.precipitation_probability_max[0]+'%</div></div><div class="wxmeta">Next 6h</div></div><div class="hourly">'+hrs.join('')+'</div>'+(wet?'<div class="alert rain"><b>Weather-smart:</b> rain risk is high. Indoor stops should move up; outdoor stops wait for a dry window.</div>':nextRain>=35?'<div class="alert"><b>Watch the sky:</b> showers are possible. Keep an indoor backup close.</div>':'');if(wet){document.getElementById('rainSmart').textContent='☔ Rain smart · recommended'}draw()}).catch(()=>{document.getElementById('wx').innerHTML='<div class="wxnow">Weather unavailable</div><div class="wxmeta">Use Rain smart manually if conditions change.</div>';draw()})}
weather();draw();
</script>
</body>
</html>
