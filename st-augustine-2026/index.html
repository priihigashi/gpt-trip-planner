<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>GPT St. Augustine Trip</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--p:#ff5fa2;--v:#8b5cf6;--o:#e8792e;--g:#0d9488;--ink:#172033;--bg:#f7f4f8;--m:#667085}*{box-sizing:border-box}body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.head{background:#fff;padding:14px 16px}.title{font-weight:850;font-size:23px}.sub,.meta{font-size:12px;color:var(--m)}.wx{margin-top:8px;background:#f5f7fa;border-radius:12px;padding:9px 10px;font-size:13px}.row{display:flex;gap:7px;overflow:auto;padding:9px 12px;background:#fff;border-top:1px solid #eee}.row button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:650}.row button.on{background:var(--ink);color:#fff}.mapwrap{position:relative}#map{height:50vh;min-height:370px}.legend{position:absolute;z-index:500;left:10px;top:10px;background:#fffffff2;padding:8px 10px;border-radius:12px;font-size:11px;box-shadow:0 2px 10px #0002}.panel{padding:12px 14px 105px;max-width:760px;margin:auto}.section{font-size:17px;font-weight:850;margin:15px 0 6px}.card{background:#fff;border:1px solid #eee;border-radius:16px;padding:13px;margin:9px 0}.d1{border-left:5px dashed var(--p)}.d2{border-left:5px dashed var(--v)}.actual{border-left:5px solid var(--p)}.trolley{border-left:5px solid var(--o)}.name{font-weight:850}.note{font-size:13px;line-height:1.45;margin-top:6px}.food{background:#fff7fb;border:1px solid #ffd2e4;border-radius:12px;padding:9px;margin-top:8px}.btn{display:inline-block;background:var(--ink);color:#fff;text-decoration:none;border-radius:9px;padding:8px 10px;margin:8px 6px 0 0;font-size:12px}.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:#fff;border:3px solid var(--ink);font-weight:850;font-size:12px}.pin.p{background:var(--p);color:#fff}.pin.v{background:var(--v);color:#fff}.pin.o{background:var(--o);color:#fff;border-color:#fff;box-shadow:0 0 0 2px var(--o)}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:700;background:#fffffff8;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:10px;padding:11px;background:var(--ink);color:#fff;font-weight:750}@media(max-width:520px){#map{min-height:350px}}</style></head><body><div class="head"><div class="title">GPT · St. Augustine</div><div class="sub">My route · saved trolley map · explore all · actual trip</div><div id="wx" class="wx">Loading weather…</div></div><div class="row" id="views"><button class="on" data-v="route">⭐ My Route</button><button data-v="trolley">🚋 Trolley Map</button><button data-v="explore">🗺 Explore All</button><button data-v="actual">✓ Actual</button></div><div class="row" id="days"><button data-d="day1">Day 1</button><button class="on" data-d="day2">Day 2</button></div><div class="row" id="ttools" style="display:none"><button class="on" data-t="all">All 22 stops</button><button data-t="useful">Highlight useful stops</button></div><div class="mapwrap"><div id="map"></div><div id="legend" class="legend"></div></div><div class="panel"><div id="content"></div></div><div class="bottom"><button id="loc">Use my location</button><button id="near">Two best next</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const C={d1:'#ff5fa2',d2:'#8b5cf6',tr:'#e8792e'};const S={brunch:{n:'Treylor Park · brunch',lat:29.8952,lng:-81.3140,t:'11:00 AM',w:'Weekend brunch with eggs, biscuit Benedict, classic breakfast, brunch nachos, chicken & pancake tacos, plus a Traditional Bloody Mary.',x:'Google rating is currently reported at 4.5. Saturday brunch runs 10 AM–4 PM. Roughly an 8–10 minute walk from the Renaissance.'},trolley:{n:'Old Town Trolley · full loop',lat:29.8989,lng:-81.3160,t:'12:15 PM',w:'90-minute narrated overview. The separate Trolley Map tab preserves all 22 stops independent of this recommendation.'},pirate:{n:'Pirate & Treasure Museum',lat:29.89702,lng:-81.31297,t:'2:00 PM',w:'Interactive indoor history + AC. Strong kid-first stop.'},snack:{n:'Coffee / snack reset',lat:29.89588,lng:-81.31198,t:'3:15 PM',w:'Cold drink, coffee, pastry or ice cream. Do not skip this food break.'},colonial:{n:'Colonial Quarter',lat:29.8966,lng:-81.3133,t:'3:45 PM',w:'Living-history demonstrations and colonial spaces.'},dinner:{n:'Columbia · late lunch / early dinner',lat:29.8940,lng:-81.3132,t:'5:15 PM',w:'Main sit-down meal. Keep a nearby backup if the wait is long.'},treat:{n:'Kilwins · treat',lat:29.89752,lng:-81.31366,t:'7:00 PM',w:'Ice cream / chocolate / fudge finish.'},plaza:{n:'Plaza + bayfront stroll',lat:29.8925,lng:-81.3128,t:'7:30 PM',w:'Optional easy finish. Nothing essential is saved this late.'},blue:{n:'Blue Hen Café',lat:29.8900,lng:-81.3267,t:'~11:45 AM',w:'Breakfast actually visited.',x:'Your rating: 4★. Chicken biscuits were good but needed jam or marmalade; you wanted more pancake flavors.'},hotel:{n:'Renaissance St. Augustine',lat:29.8994,lng:-81.3156,t:'~1:00 PM',w:'They allowed early check-in. Parked across the street in the city garage for one $20 entry.'},walk:{n:'Short historic-district walk',lat:29.8981,lng:-81.3144,t:'1:15–2:20 PM',w:'Stayed close to the hotel, wandered a little, then turned back toward the fort.'},castle:{n:'Castillo de San Marcos',lat:29.89786,lng:-81.31152,t:'~2:30 PM–close',w:'Stayed until closing.',x:'$15/adult; kids free. Clean bathrooms, water fountains, small kid-play room, beautiful outdoor grounds. Kids played with sand/sticks and climbed rocks.'},pizz:{n:'Pizzalley’s / Chianti Room',lat:29.89421,lng:-81.31278,t:'Dinner',w:'Dinner was great.',x:'Sweet Datil’ roni + lasagna shared. Kids had cheese pizza and spaghetti, about $10 each.'},sweet:{n:'The Sweet Spot (likely)',lat:29.8963,lng:-81.3134,t:'Evening',w:'Kids got ice cream while walking stores.',x:'It was okay; next time choose Kilwins or Ben & Jerry’s.'},hotel8:{n:'Back at hotel',lat:29.8994,lng:-81.3156,t:'~8:00 PM',w:'Great shower and rest.'},flagler:{n:'Flagler College',lat:29.8929,lng:-81.3146,w:'Gilded Age architecture.'},lightner:{n:'Lightner Museum',lat:29.8910,lng:-81.3137,w:'Indoor museum and heat/rain backup.'},school:{n:'Oldest Wooden Schoolhouse',lat:29.89734,lng:-81.31355,w:'Quick historic stop.'},play:{n:'Project Swing',lat:29.8982,lng:-81.31688,w:'Shaded playground.'},ripley:{n:"Ripley’s Believe It or Not!",lat:29.9023,lng:-81.3153,w:'Indoor kid backup.'},mose:{n:'Fort Mose',lat:29.9590,lng:-81.3430,w:'Important Black history site outside compact downtown.'}};const plans={day1:[S.blue,S.hotel,S.trolley,S.pirate,S.colonial,S.pizz,S.treat],day2:[S.brunch,S.trolley,S.pirate,S.snack,S.colonial,S.dinner,S.treat,S.plaza],actual:[S.blue,S.hotel,S.walk,S.castle,S.pizz,S.sweet,S.hotel8]},explore=[S.castle,S.pirate,S.colonial,S.flagler,S.lightner,S.school,S.play,S.ripley,S.plaza,S.mose,S.brunch,S.snack,S.dinner,S.treat];const T=[[1,'Old Town · Old Jail / Oldest Store / History Museum',29.9105,-81.3217],[2,'Visitor Information Center',29.9006,-81.3163],[3,'Old Drug Store · Potter’s Wax · Tolomato Cemetery',29.8994,-81.3148],[4,'City Gates · St. George St · Oldest Wooden Schoolhouse',29.8977,-81.3137],[5,'Colonial Quarter · Pirate Museum · Castillo',29.8967,-81.3130],[6,'Bay View at Best Western',29.8956,-81.3111],[7,'Hypolita St & St. George · Shipwreck Museum',29.8950,-81.3132],[8,'Flagler Memorial Presbyterian · Grace Methodist',29.8944,-81.3160],[9,'Villa Zorayda Museum',29.8916,-81.3151],[10,'Lightner Museum · Flagler College',29.8911,-81.3140],[11,'Lincolnville Museum & Cultural Center',29.8848,-81.3150],[12,'St. Augustine Distillery',29.8896,-81.3252],[13,'San Sebastian Winery · Whetstone Chocolates',29.8900,-81.3229],[14,'Plaza · Government House · Cathedral · Peña-Peck',29.8925,-81.3128],[15,'St. Augustine Marina · Ripley’s Bayfront Mini Golf',29.8902,-81.3104],[16,'Oldest House · Fernandez Llambias House',29.8870,-81.3122],[17,'Castillo de San Marcos',29.8979,-81.3115],[18,"Ripley’s Believe It or Not!",29.9023,-81.3153],[19,'Old Town Trolley Welcome Center · Uptown',29.9100,-81.3225],[20,'Mission Nombre de Dios · Shrine',29.9058,-81.3160],[21,'Old Senator · Villa 1565',29.9082,-81.3158],[22,'Fountain of Youth',29.9107,-81.3115]],useful=new Set([4,5,9,10,14,17,18,20,22]);let view='route',day='day2',tmode='all',here=null,marks=[],lines=[];const map=L.map('map').setView([29.897,-81.315],14);L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function nav(a,b){return'https://www.google.com/maps/dir/?api=1&destination='+a+','+b+'&travelmode=walking'}function search(n){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(n+' St Augustine FL')}function mi(a,b,c,d){const R=3958.8,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),q=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function clearMap(){while(marks.length)map.removeLayer(marks.pop());while(lines.length)map.removeLayer(lines.pop())}function addList(list,color,dashed,actual){for(let i=0;i<list.length-1;i++)lines.push(L.polyline([[list[i].lat,list[i].lng],[list[i+1].lat,list[i+1].lng]],{color,weight:5,opacity:.8,dashArray:dashed?'9 9':null}).addTo(map));list.forEach((s,i)=>{const cls='pin '+(actual?'p':color===C.d2?'v':'');const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="'+cls+'">'+(i+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);m.bindPopup('<b>'+((s.t||'')+' · ')+s.n+'</b><div>'+s.w+'</div>'+(here?'<div>From you: '+mi(here.lat,here.lng,s.lat,s.lng).toFixed(1)+' mi</div>':'')+'<a class="btn" target="_blank" href="'+nav(s.lat,s.lng)+'">Walk there</a>');marks.push(m)});map.fitBounds(list.map(s=>[s.lat,s.lng]),{padding:[35,35],maxZoom:15})}function addTrolley(){const pts=T.map(x=>[x[2],x[3]]);lines.push(L.polyline(pts,{color:C.tr,weight:6,opacity:.8}).addTo(map));T.forEach(x=>{const m=L.marker([x[2],x[3]],{opacity:tmode==='useful'&&!useful.has(x[0])?.3:1,icon:L.divIcon({className:'',html:'<div class="pin o">'+x[0]+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);m.bindPopup('<b>Stop '+x[0]+'</b><div>'+x[1]+'</div><div class="meta">'+(useful.has(x[0])?'Useful for our trip':'Saved from trolley brochure')+'</div><a class="btn" target="_blank" href="'+search(x[1])+'">Open in Maps</a>');marks.push(m)});map.fitBounds(pts,{padding:[30,30],maxZoom:14})}function card(s,cls){return'<div class="card '+cls+'"><div class="name">'+(s.t?s.t+' · ':'')+s.n+'</div><div class="note">'+s.w+'</div>'+(s.x?'<div class="food">'+s.x+'</div>':'')+'<a class="btn" target="_blank" href="'+search(s.n)+'">Reviews / hours</a><a class="btn" target="_blank" href="'+nav(s.lat,s.lng)+'">Route</a></div>'}function render(){const c=document.getElementById('content');if(view==='route'){const l=plans[day];c.innerHTML='<div class="section">Recommended '+(day==='day2'?'Day 2':'Day 1')+'</div>'+l.map(s=>card(s,day==='day2'?'d2':'d1')).join('')+(day==='day2'?'<div class="card"><div class="note"><b>Food anchors:</b> 11:00 brunch → 3:15 snack/coffee → 5:15 late lunch/early dinner → 7:00 treat.</div></div>':'')}else if(view==='trolley'){c.innerHTML='<div class="section">Saved Trolley Map · all 22 stops</div><div class="card trolley"><div class="note">Independent of my recommendations. This preserves the full brochure route; use Highlight useful stops only when you want overlap with our trip.</div></div>'+T.map(x=>'<div class="card trolley"><div class="name">Stop '+x[0]+' · '+x[1]+'</div></div>').join('')}else if(view==='explore'){c.innerHTML='<div class="section">Explore All</div>'+explore.map(s=>card(s,'')).join('')}else c.innerHTML='<div class="section">What we actually did · Friday</div>'+plans.actual.map(s=>card(s,'actual')).join('')}function draw(){clearMap();document.getElementById('days').style.display=view==='route'?'flex':'none';document.getElementById('ttools').style.display=view==='trolley'?'flex':'none';if(view==='route')addList(plans[day],day==='day2'?C.d2:C.d1,true,false);else if(view==='trolley')addTrolley();else if(view==='explore')addList(explore,'#667085',false,false);else addList(plans.actual,C.d1,false,true);if(here)marks.push(L.circleMarker([here.lat,here.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map).bindPopup('You are here'));document.getElementById('legend').innerHTML=view==='trolley'?'<b>Orange = trolley</b><br>All 22 brochure stops':'Pink = Day 1 / actual<br>Purple = Day 2<br>solid = actual · dashed = plan';render()}document.getElementById('views').onclick=e=>{if(!e.target.dataset.v)return;document.querySelectorAll('#views button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.v;draw()};document.getElementById('days').onclick=e=>{if(!e.target.dataset.d)return;document.querySelectorAll('#days button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');day=e.target.dataset.d;draw()};document.getElementById('ttools').onclick=e=>{if(!e.target.dataset.t)return;document.querySelectorAll('#ttools button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');tmode=e.target.dataset.t;draw()};document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};draw()},()=>alert('Location blocked. Allow location in Safari settings.'));document.getElementById('near').onclick=()=>{if(!here){alert('Tap Use my location first.');return}const r=explore.map(s=>({s,d:mi(here.lat,here.lng,s.lat,s.lng)})).sort((a,b)=>a.d-b.d).slice(0,2);alert('A: '+r[0].s.n+' · '+r[0].d.toFixed(1)+' mi\nB: '+r[1].s.n+' · '+r[1].d.toFixed(1)+' mi')};fetch('https://api.open-meteo.com/v1/forecast?latitude=29.897&longitude=-81.314&current=temperature_2m,apparent_temperature&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=3').then(r=>r.json()).then(w=>document.getElementById('wx').innerHTML='<b>'+Math.round(w.current.temperature_2m)+'°</b> · feels '+Math.round(w.current.apparent_temperature)+'° · today rain '+w.daily.precipitation_probability_max[0]+'%').catch(()=>document.getElementById('wx').textContent='Weather unavailable');draw();</script></body></html>
