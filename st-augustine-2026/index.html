<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#172033"><title>GPT St. Augustine Trip</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><style>:root{--pink:#ff5fa2;--purple:#8b5cf6;--ink:#172033;--muted:#667085;--bg:#f7f4f8;--green:#0d9488;--gold:#f2b84b}*{box-sizing:border-box}html,body{margin:0;background:var(--bg);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:var(--ink)}.head{padding:14px 16px;background:#fff}.title{font-size:23px;font-weight:850}.sub{font-size:13px;color:var(--muted)}.wx{margin-top:8px;padding:9px 10px;background:#f5f7fa;border-radius:12px;font-size:13px}.tabs,.filters{display:flex;gap:7px;overflow:auto;padding:9px 12px;background:#fff}.tabs button,.filters button{border:1px solid #ddd;background:#fff;border-radius:999px;padding:8px 12px;white-space:nowrap;font-weight:650}.tabs .on{background:var(--ink);color:#fff}.filters .on{background:#fff0f6;border-color:#ff9ec5}#map{height:46vh;min-height:360px}.mapwrap{position:relative}.legend{position:absolute;z-index:500;left:10px;top:10px;background:#fffffff2;padding:8px 10px;border-radius:12px;font-size:11px;box-shadow:0 2px 10px #0002}.dot{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}.panel{padding:12px 14px 105px;max-width:760px;margin:auto}.section{font-weight:850;margin:15px 0 6px}.card{background:#fff;border-radius:16px;padding:13px;margin:9px 0;border:1px solid #eee}.plan1{border-left:5px dashed var(--pink)}.plan2{border-left:5px dashed var(--purple)}.actual{border-left:5px solid var(--pink)}.meal{background:#fffaf0}.name{font-weight:850}.meta{font-size:12px;color:var(--muted);margin-top:4px}.note{font-size:13px;line-height:1.45;margin-top:6px}.foodbox{background:#fff7fb;border:1px solid #ffd2e4;border-radius:12px;padding:9px;margin-top:8px}.chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:8px}.chip{font-size:11px;border:1px solid #ddd;border-radius:99px;padding:4px 7px}.btn{display:inline-block;background:var(--ink);color:white;text-decoration:none;border-radius:9px;padding:8px 10px;margin:8px 6px 0 0;font-size:12px}.bottom{position:fixed;bottom:0;left:0;right:0;z-index:700;background:#fffffff5;border-top:1px solid #ddd;padding:10px 12px calc(10px + env(safe-area-inset-bottom));display:flex;gap:8px}.bottom button{flex:1;border:0;border-radius:10px;padding:11px;background:var(--ink);color:white;font-weight:750}.pin{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;background:white;border:3px solid var(--ink);font-weight:850;font-size:12px}.pin.actual{background:var(--pink);color:white}.pin.tom{background:var(--purple);color:white}.pin.must{background:var(--gold)}@media(max-width:520px){#map{min-height:350px}}</style></head><body><div class="head"><div class="title">GPT · St. Augustine</div><div class="sub">Recommended plans first · actual trip log last</div><div id="wx" class="wx">Loading weather…</div></div><div class="tabs"><button class="on" data-view="day1">Day 1 plan</button><button data-view="day2">Day 2 plan</button><button data-view="actual">What we actually did</button></div><div class="filters"><button class="on" data-f="all">Everything</button><button data-f="must">Must see</button><button data-f="kids">Kids</button><button data-f="food">Food</button><button data-f="history">History</button><button data-f="rest">Rest / AC</button></div><div class="mapwrap"><div id="map"></div><div class="legend"><div><span class="dot" style="background:#ff5fa2"></span>Day 1 / confirmed</div><div><span class="dot" style="background:#8b5cf6"></span>Day 2</div><div>solid = did it · dashed = plan</div></div></div><div class="panel"><div id="content"></div></div><div class="bottom"><button id="loc">Use my location</button><button id="next">Two best next</button></div><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script>const PINK='#ff5fa2',PURPLE='#8b5cf6';const S={blue:{name:'Blue Hen Café',lat:29.8900,lng:-81.3267,t:'11:30',tags:['food'],actual:1,meal:1,what:'Breakfast actually visited.',detail:'Your rating: 4★. Chicken biscuits were good but needed jam or marmalade; you wanted more pancake flavors.'},hotel:{name:'Renaissance St. Augustine Historic Downtown Hotel',lat:29.8994,lng:-81.3156,t:'1:00',tags:['rest'],actual:1,what:'Early check-in and bag drop.',detail:'They let you check in early. You parked across the street in the city garage for $20 per entry instead of hotel valet.'},walk:{name:'Historic district wandering',lat:29.8982,lng:-81.3146,t:'1:20',tags:['history','kids'],actual:1,what:'Short wandering loop near the hotel before turning back toward the fort.'},castillo:{name:'Castillo de San Marcos',lat:29.89786,lng:-81.31152,t:'2:30',tags:['history','kids','must'],must:1,actual:1,what:'Stayed until closing.',detail:'$15/adult; kids free. Clean bathrooms, water fountains, small kids room, beautiful grounds. Kids played with sand/sticks and climbed rocks.'},pizz:{name:'Pizzalley’s / Chianti Room',lat:29.89421,lng:-81.31278,t:'5:30',tags:['food','kids'],actual:1,meal:1,what:'Dinner was great.',detail:'Sweet Datil’ roni pizza with pepperoni, ricotta and hot honey + lasagna; kids cheese pizza and spaghetti, about $10 each.'},sweet:{name:'The Sweet Spot (likely)',lat:29.8963,lng:-81.3134,t:'7:00',tags:['food','kids'],actual:1,meal:1,what:'Ice cream while walking stores.',detail:'It was okay; next time you would choose Kilwins or Ben & Jerry’s.'},hotel8:{name:'Hotel · shower + rest',lat:29.8994,lng:-81.3156,t:'8:00',tags:['rest'],actual:1,what:'Back at the hotel, great shower and rest.'},georgies:{name:'Georgie’s Diner',lat:29.89208,lng:-81.32072,t:'11:00',tags:['food','kids'],meal:1,what:'Day 2 brunch anchor: pancakes/French toast, eggs, skillets, bacon and coffee.',detail:'Best fit for your pancake-house/diner request. Backup: Metro Diner if you want an even larger breakfast menu.'},trolley:{name:'Old Town Trolley · full loop',lat:29.8989,lng:-81.316,t:'12:15',tags:['history','kids','rest'],what:'90-minute narrated loop after brunch; gives everyone a seated break and city overview.'},pirate:{name:'Pirate & Treasure Museum',lat:29.89702,lng:-81.31297,t:'2:00',tags:['history','kids','must','rest'],must:1,what:'Interactive, indoor and AC. Strong kid-first stop after trolley.'},snack:{name:'Coffee + snack · Crucial Coffee / Kookaburra',lat:29.89588,lng:-81.31198,t:'3:15',tags:['food','rest'],meal:1,what:'Mandatory snack/drink break — coffee, cold drink, pastry or ice cream so nobody crashes before dinner.'},colonial:{name:'Colonial Quarter',lat:29.8966,lng:-81.3133,t:'3:45',tags:['history','kids','must'],must:1,what:'Living-history stop while it is still open. If everyone is tired, shorten this rather than skipping food.'},columbia:{name:'Columbia Restaurant',lat:29.8940,lng:-81.3130,t:'5:15',tags:['food','kids','must'],meal:1,must:1,what:'Late lunch / early dinner anchor.',detail:'Good timing after attractions. Mike has seafood options; for you, non-seafood choices include Cuban/Spanish meat dishes and the 1905 salad. Keep a nearby backup if the wait is long.'},treat:{name:'Kilwins · evening treat',lat:29.89752,lng:-81.31366,t:'7:00',tags:['food','kids'],meal:1,what:'Dessert/treat finish: ice cream, fudge or chocolate while walking St. George.'},plaza:{name:'Plaza + bayfront stroll',lat:29.8925,lng:-81.3128,t:'7:30',tags:['history','rest'],what:'Easy optional walk after dessert; no important attraction is saved this late.'},flagler:{name:'Flagler College exterior',lat:29.8929,lng:-81.3146,t:'Optional',tags:['history'],what:'See the architecture while walking; do not let it displace the meal anchors.'}};const plans={day1:[S.blue,S.hotel,S.trolley,S.pirate,S.colonial,S.pizz,S.treat],day2:[S.georgies,S.trolley,S.pirate,S.snack,S.colonial,S.columbia,S.treat,S.plaza],actual:[S.blue,S.hotel,S.walk,S.castillo,S.pizz,S.sweet,S.hotel8]};let view='day1',filter='all',here=null;const map=L.map('map').setView([29.896,-81.315],14),marks=[],lines=[];L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'© OpenStreetMap'}).addTo(map);function mi(a,b,c,d){const R=3958.8,r=x=>x*Math.PI/180,u=r(c-a),v=r(d-b),q=Math.sin(u/2)**2+Math.cos(r(a))*Math.cos(r(c))*Math.sin(v/2)**2;return R*2*Math.atan2(Math.sqrt(q),Math.sqrt(1-q))}function nav(s){return'https://www.google.com/maps/dir/?api=1&destination='+s.lat+','+s.lng+'&travelmode=walking'}function reviews(s){return'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(s.name+' St Augustine FL')}function match(s){return filter==='all'||(filter==='must'&&s.must)||(s.tags&&s.tags.includes(filter))}function clearMap(){while(marks.length)map.removeLayer(marks.pop());while(lines.length)map.removeLayer(lines.pop())}function draw(){clearMap();const full=plans[view],list=full.filter(match),color=view==='day2'?PURPLE:PINK,dashed=view!=='actual';for(let i=0;i<full.length-1;i++)lines.push(L.polyline([[full[i].lat,full[i].lng],[full[i+1].lat,full[i+1].lng]],{color,weight:5,opacity:.8,dashArray:dashed?'9 9':null}).addTo(map));list.forEach((s,i)=>{const cls='pin '+(view==='actual'?'actual':view==='day2'?'tom':s.must?'must':'');const m=L.marker([s.lat,s.lng],{icon:L.divIcon({className:'',html:'<div class="'+cls+'">'+(i+1)+'</div>',iconSize:[30,30],iconAnchor:[15,15]})}).addTo(map);m.bindPopup('<b>'+s.t+' · '+s.name+'</b><div>'+s.what+'</div>'+(here?'<div>From you: '+mi(here.lat,here.lng,s.lat,s.lng).toFixed(1)+' mi</div>':'')+'<a class="btn" target="_blank" href="'+nav(s)+'">Walk there</a>');marks.push(m)});if(here)marks.push(L.circleMarker([here.lat,here.lng],{radius:9,color:'#fff',weight:3,fillColor:'#0d9488',fillOpacity:1}).addTo(map).bindPopup('You are here'));if(list.length)map.fitBounds(list.map(s=>[s.lat,s.lng]),{padding:[35,35],maxZoom:15});render()}function card(s,cls){return'<div class="card '+cls+(s.meal?' meal':'')+'"><div class="name">'+s.t+' · '+s.name+'</div><div class="note">'+s.what+'</div>'+(s.detail?'<div class="foodbox">'+s.detail+'</div>':'')+'<div class="chips">'+(s.meal?'<span class="chip">Food anchor</span>':'')+(s.must?'<span class="chip">Must see</span>':'')+(s.tags.includes('kids')?'<span class="chip">Kids</span>':'')+'</div><a class="btn" target="_blank" href="'+reviews(s)+'">Reviews / hours</a><a class="btn" target="_blank" href="'+nav(s)+'">Route</a></div>'}function render(){const c=document.getElementById('content');const title=view==='day1'?'Recommended Day 1':view==='day2'?'Recommended Day 2 · food anchored':'What we actually did · Friday';const cls=view==='day1'?'plan1':view==='day2'?'plan2':'actual';c.innerHTML='<div class="section">'+title+'</div>'+plans[view].filter(match).map(s=>card(s,cls)).join('')+(view==='day2'?'<div class="card"><div class="name">Day 2 meal rhythm</div><div class="note"><b>11:00 brunch → 3:15 snack/coffee → 5:15 late lunch/early dinner → 7:00 treat.</b> Attractions move around those anchors, not the other way around.</div></div>':'')}document.querySelector('.tabs').onclick=e=>{if(!e.target.dataset.view)return;document.querySelectorAll('.tabs button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');view=e.target.dataset.view;draw()};document.querySelector('.filters').onclick=e=>{if(!e.target.dataset.f)return;document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('on'));e.target.classList.add('on');filter=e.target.dataset.f;draw()};document.getElementById('loc').onclick=()=>navigator.geolocation.getCurrentPosition(p=>{here={lat:p.coords.latitude,lng:p.coords.longitude};draw()},()=>alert('Location blocked. Allow location in Safari settings.'));document.getElementById('next').onclick=()=>{view='day2';document.querySelectorAll('.tabs button').forEach(b=>b.classList.toggle('on',b.dataset.view==='day2'));draw()};fetch('https://api.open-meteo.com/v1/forecast?latitude=29.897&longitude=-81.314&current=temperature_2m,apparent_temperature&daily=temperature_2m_max,precipitation_probability_max&temperature_unit=fahrenheit&timezone=America%2FNew_York&forecast_days=3').then(r=>r.json()).then(w=>document.getElementById('wx').innerHTML='<b>'+Math.round(w.current.temperature_2m)+'°</b> · feels '+Math.round(w.current.apparent_temperature)+'° · today rain '+w.daily.precipitation_probability_max[0]+'% · tomorrow '+Math.round(w.daily.temperature_2m_max[1])+'° / rain '+w.daily.precipitation_probability_max[1]+'%').catch(()=>document.getElementById('wx').textContent='Weather unavailable');draw();</script></body></html>
